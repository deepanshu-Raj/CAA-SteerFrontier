[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caa-steer-frontier"
version = "0.1.0"
description = "Model-aware Contrastive Activation Addition experiments for behavior-capability tradeoffs."
authors = [
    { name = "Deepanshu Raj", email = "deepraj@uchicago.edu" }
]
requires-python = ">=3.9,<3.10"

# requirements.txt is the authoritative tested CUDA reproduction environment.
# These package constraints keep editable installs semantically aligned while
# allowing the CUDA-specific torch wheel to be installed from requirements.txt.
dependencies = [
    "torch>=2.0,<2.1",
    "transformers>=4.43,<4.44",
    "datasets>=2.14,<2.15",
    "huggingface-hub>=0.24,<0.25",
    "numpy>=1.24,<1.25",
    "pandas>=2.0,<2.1",
    "scipy>=1.11,<1.12",
    "tqdm>=4.66,<4.67",
    "PyYAML>=6.0,<6.1",
    "matplotlib>=3.7,<3.8",
    "scikit-learn>=1.3,<1.4",
    "safetensors>=0.4,<0.5",
    "sentencepiece>=0.2,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<7.5",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true