[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caa-steer-frontier"
version = "0.2.0"
description = "Model-aware Contrastive Activation Addition experiments for behavior-capability tradeoffs."
authors = [
    { name = "Deepanshu Raj", email = "deepraj@uchicago.edu" }
]
requires-python = ">=3.11,<3.12"

dependencies = [
    "torch>=2.5,<2.6",
    "transformers>=4.46,<4.47",
    "datasets>=3.1,<3.2",
    "accelerate>=1.1,<1.2",

    "numpy>=1.26,<2.0",
    "pandas>=2.2,<2.3",
    "scipy>=1.14,<1.15",
    "scikit-learn>=1.5,<1.6",
    "matplotlib>=3.9,<3.10",

    "sentencepiece>=0.2,<0.3",
    "safetensors>=0.4",
    "huggingface-hub>=0.26",
    "protobuf>=5",
    "tqdm>=4.66",
    "PyYAML>=6.0",
    "pyarrow>=17",
]

[project.optional-dependencies]
judge = [
    "openai>=3.16,<3.17",
]

dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
