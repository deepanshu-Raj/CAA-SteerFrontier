[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caa-steer-frontier"
version = "0.1.0"
description = "Behavior-capability tradeoff analysis for Contrastive Activation Addition"
requires-python = ">=3.9,<3.10"

dependencies = [
    "torch==2.0.1+cu118",
    "transformers==4.33.2",
    "datasets==2.14.5",
    "huggingface-hub==0.17.2",
    "numpy==1.24.4",
    "pandas==2.0.3",
    "tqdm==4.66.1",
    "PyYAML==6.0.1",
    "matplotlib==3.7.3",
    "scikit-learn==1.3.1",
    "ipykernel==6.25.2",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]
